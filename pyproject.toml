[project]
name = "company-research-agent"
version = "0.1.0"
description = "DeepEquity — Agentic Company Research System"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.3.11",
    "langchain-core==1.5.2",
    "langgraph==1.2.5",
    "langsmith>=0.8.18",
    "langchain-anthropic>=1.5.4,<2.0.0",
    "pydantic>=2.13.4",
    "tavily-python>=0.7.26",
    "requests>=2.33.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.2",
    "python-dotenv>=1.2.2",
    "pypdf==6.20.1",
]

[tool.uv]
override-dependencies = [
    "nbconvert>=7.17.1",  # CVE-2025-53000
    "protobuf>=7.35.1",  # CVE-2026-0994
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "mypy>=2.1.0",
    "ruff>=0.15.20",
]

[project.scripts]
deepequity = "research_agent.runner:main"
deepequity-review = "research_agent.review:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research_agent*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["py.typed"]
research_agent = [
    "review_rules/*.md",
    "skills/investment-master/SKILL.md",
    "skills/investment-master/LICENSE",
    "skills/investment-master/manifest.json",
    "skills/investment-master/runtime_policy.json",
    "skills/investment-master/references/*.md",
]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
